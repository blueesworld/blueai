<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue AI</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#ececec;--mute:#9b9b9b;--line:rgba(255,255,255,.1);--bg:#212121;--side:#171717;--panel:#2f2f2f;--accent:#3d7bff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
aside.glass{background:var(--side);border:0}
.glass{background:var(--panel);border:0}
.glow{box-shadow:0 8px 30px rgba(0,0,0,.45)}
.btn{background:#fff;color:#0d0d0d;transition:background .15s}
.btn:hover{background:#e3e3e3}
.btn:disabled{opacity:.5}
.ghost{transition:background .15s}
.ghost:hover{background:rgba(255,255,255,.08)}
input,textarea,select{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--ink);border-radius:12px;padding:.65rem .85rem;width:100%;font:inherit;font-size:.95rem;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:#8e8e8e}
input:focus,textarea:focus,select:focus{outline:0;border-color:rgba(255,255,255,.5)}
textarea.bare{border:0;background:transparent;padding:.5rem .25rem;box-shadow:none}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
select option{background:#2f2f2f}
input[type=range]{padding:0;accent-color:#fff;border:0}
.mono{font-family:'JetBrains Mono',monospace}
.md{font-size:1rem}
.md p{margin:.6em 0;line-height:1.75}.md ul{list-style:disc;padding-left:1.5em}.md ol{list-style:decimal;padding-left:1.5em}.md li{margin:.25em 0}
.md h1,.md h2,.md h3{font-weight:600;margin:1em 0 .4em}
.md code:not(pre code){background:rgba(255,255,255,.1);padding:.12em .4em;border-radius:6px;font-size:.88em}
.md pre{position:relative;background:#0d0d0d;border-radius:12px;padding:1rem;overflow-x:auto;margin:.9em 0;font-size:.85rem;line-height:1.6}
.md pre code{font-family:'JetBrains Mono',monospace}
.copy{position:absolute;top:.5rem;right:.5rem;font-size:.72rem;padding:.25rem .6rem;border-radius:8px;background:rgba(255,255,255,.1)}
.copy:hover{background:rgba(255,255,255,.18)}
.dot{animation:p 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes p{0%,80%,100%{opacity:.25}40%{opacity:1}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app" class="h-full flex"></div>
<div id="modal-root"></div>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 glass rounded-xl px-4 py-2 text-sm hidden z-[100]"></div>

<script>
/* ============================================================
   Blue AI – lokale KI-Oberfläche (Ollama / OpenAI-kompatibel lokal)
   Keine externen KI-APIs. Alle Daten bleiben im Browser (localStorage).
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast('Speichern fehlgeschlagen (Speicher voll oder blockiert).'); } }
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 3200); }
const icons = () => window.lucide && lucide.createIcons();

/* ---------- Modelle & Standardwerte ---------- */
const MODELS = {
  'blue-1.0':   { name: 'Blue AI 1.0',     desc: 'Schnell und ressourcenschonend', tag: 'blue-ai:1.0' },
  'blue-1.1pro':{ name: 'Blue AI 1.1 Pro', desc: 'Mehr Kontext, präzisere Antworten', tag: 'blue-ai:1.1-pro' }
};
const OLD_SYSTEM = 'Du bist Blue AI, ein hilfreicher, präziser Assistent. Antworte in der Sprache des Nutzers.';
const DEFAULT_SYSTEM = [
  'Du bist Blue AI, ein hilfreicher, ehrlicher und präziser Assistent.',
  '- Antworte in der Sprache des Nutzers, klar und ohne Füllfloskeln.',
  '- Beantworte zuerst die eigentliche Frage, danach Details oder Beispiele.',
  '- Wenn dir Informationen fehlen oder du unsicher bist, sag das offen, statt etwas zu erfinden.',
  '- Bei unklaren Fragen stelle höchstens eine kurze Rückfrage.',
  '- Erkenne die Absicht hinter einer Frage, auch bei Tippfehlern, Umgangssprache oder sehr kurzen Nachrichten.',
  '- Code kommt in Markdown-Codeblöcken mit Sprachangabe, Rechenwege Schritt für Schritt.'
].join('\n');
const MODEL_EXTRA = {
  'blue-1.0': 'Halte Antworten kurz und direkt.',
  'blue-1.1pro': 'Denke Probleme Schritt für Schritt durch, strukturiere längere Antworten mit Überschriften und Listen und prüfe dein Ergebnis, bevor du antwortest.'
};
/* Grobe Token-Schätzung (ca. 3,5 Zeichen pro Token) und Kontext-Beschnitt, damit lange Chats nicht überlaufen */
const approxTok = t => Math.ceil(t.length / 3.5);
function fitHistory(msgs, budget) {
  const out = []; let used = 0;
  for (let i = msgs.length - 1; i >= 0; i--) { used += approxTok(msgs[i].content); if (used > budget && out.length) break; out.unshift(msgs[i]); }
  return out;
}
const BROWSER_MODELS = {
  'blue-1.0': 'Llama-3.2-1B-Instruct-q4f16_1-MLC',
  'blue-1.1pro': 'Llama-3.2-3B-Instruct-q4f16_1-MLC'
};
const WEBLLM_URL = 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm';
const DEFAULTS = {
  backend: 'browser',
  endpoint: 'http://localhost:11434', temperature: 0.7, top_p: 0.9, num_ctx: 4096,
  system: DEFAULT_SYSTEM,
  tags: { 'blue-1.0': MODELS['blue-1.0'].tag, 'blue-1.1pro': MODELS['blue-1.1pro'].tag }
};

/* ---------- Auth (nur clientseitig, siehe Hinweis im Register-Dialog) ---------- */
async function hash(pw, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 150000, hash: 'SHA-256' }, k, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const Auth = {
  users: () => store.get('blue_users', {}),
  session: () => store.get('blue_session', null),
  async register(name, email, pw) {
    const users = this.users(); email = email.trim().toLowerCase();
    if (!name.trim() || !/^\S+@\S+\.\S+$/.test(email)) throw new Error('Bitte gültigen Namen und E-Mail eingeben.');
    if (pw.length < 8) throw new Error('Das Passwort braucht mindestens 8 Zeichen.');
    if (users[email]) throw new Error('Für diese E-Mail existiert bereits ein Konto.');
    const salt = uid();
    users[email] = { id: uid(), name: name.trim(), email, salt, hash: await hash(pw, salt), created: Date.now() };
    store.set('blue_users', users); store.set('blue_session', { email });
  },
  async login(email, pw) {
    email = email.trim().toLowerCase(); const u = this.users()[email];
    if (!u || await hash(pw, u.salt) !== u.hash) throw new Error('E-Mail oder Passwort stimmt nicht.');
    store.set('blue_session', { email });
  },
  logout() { localStorage.removeItem('blue_session'); },
  current() { const s = this.session(); return s ? this.users()[s.email] || null : null; },
  update(patch) { const u = this.current(); const users = this.users(); users[u.email] = { ...u, ...patch }; store.set('blue_users', users); },
  remove() { const u = this.current(); const users = this.users(); delete users[u.email]; store.set('blue_users', users); localStorage.removeItem('blue_data_' + u.id); this.logout(); }
};

/* ---------- Zustand pro Nutzer ---------- */
const S = { user: null, data: null, view: 'chat', busy: false, ctrl: null, sidebar: false };
function loadData() {
  S.data = store.get('blue_data_' + S.user.id, null) || { chats: [], active: null, model: 'blue-1.1pro', settings: structuredClone(DEFAULTS) };
  if (S.data.settings && !S.data.settings.customSystem) S.data.settings.system = DEFAULT_SYSTEM;
  S.data.settings = { ...structuredClone(DEFAULTS), ...S.data.settings, tags: { ...DEFAULTS.tags, ...(S.data.settings.tags || {}) } };
}
const save = () => store.set('blue_data_' + S.user.id, S.data);
const chat = () => S.data.chats.find(c => c.id === S.data.active);
function newChat() { const c = { id: uid(), title: 'Neuer Chat', messages: [], created: Date.now() }; S.data.chats.unshift(c); S.data.active = c.id; S.view = 'chat'; save(); render(); }

/* ---------- Backend 1: Modell direkt im Browser (WebLLM, WebGPU) ---------- */
async function getEngine(modelId, onStatus) {
  if (!navigator.gpu) throw new Error('Dieser Browser unterstützt WebGPU nicht.');
  if (location.protocol === 'file:') throw new Error('Per Doppelklick (file://) kann der Browser das Modell nicht zwischenspeichern.');
  if (S.engine && S.engineId === modelId) return S.engine;
  const cb = p => onStatus(`Lade ${MODELS[S.data.model].name} … ${Math.round((p.progress || 0) * 100)} % (einmalig, danach im Cache)`);
  if (S.engine) { await S.engine.reload(modelId); S.engineId = modelId; return S.engine; }
  const webllm = await import(WEBLLM_URL);
  S.engine = await webllm.CreateMLCEngine(modelId, { initProgressCallback: cb });
  S.engineId = modelId; return S.engine;
}
async function streamBrowser(reply, msgs, st) {
  const engine = await getEngine(BROWSER_MODELS[S.data.model], t => { reply.content = '*' + t + '*'; renderMessages(true); });
  reply.content = ''; renderMessages(true);
  S.ctrl.signal.addEventListener('abort', () => { S.aborted = true; engine.interruptGenerate(); });
  const stream = await engine.chat.completions.create({ messages: msgs, stream: true, temperature: +st.temperature, top_p: +st.top_p });
  for await (const ch of stream) { const d = ch.choices[0]?.delta?.content; if (d) { reply.content += d; renderMessages(true); } }
}

/* ---------- Backend 2: Ollama /api/chat (NDJSON-Stream) ---------- */
async function streamOllama(reply, msgs, st) {
  const res = await fetch(st.endpoint.replace(/\/$/, '') + '/api/chat', {
    method: 'POST', signal: S.ctrl.signal, headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: st.tags[S.data.model], stream: true, messages: msgs, options: { temperature: +st.temperature, top_p: +st.top_p, num_ctx: +st.num_ctx } })
  });
  if (!res.ok) throw new Error('Server antwortete mit Status ' + res.status + (res.status === 404 ? ' – Modell „' + st.tags[S.data.model] + '“ ist nicht installiert.' : ''));
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  while (true) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop();
    for (const l of lines) { if (!l.trim()) continue; const j = JSON.parse(l); if (j.message?.content) { reply.content += j.message.content; renderMessages(true); } }
  }
}

/* ---------- Chat-Steuerung (Ollama /api/chat, NDJSON-Stream) ---------- */
async function send(text) {
  text = text.trim(); if (!text || S.busy) return;
  if (!chat()) newChat();
  const c = chat(), st = S.data.settings;
  c.messages.push({ role: 'user', content: text });
  if (c.messages.length === 1) c.title = text.slice(0, 48);
  const reply = { role: 'assistant', content: '', model: S.data.model };
  c.messages.push(reply); S.busy = true; S.ctrl = new AbortController(); save(); renderMessages();
  const sys = st.system + '\n\n' + MODEL_EXTRA[S.data.model];
  const msgs = [{ role: 'system', content: sys }, ...fitHistory(c.messages.slice(0, -1), Math.floor(st.num_ctx * 0.7) - approxTok(sys)).map(({ role, content }) => ({ role, content }))];
  S.aborted = false;
  try {
    if (st.backend === 'ollama') await streamOllama(reply, msgs, st); else await streamBrowser(reply, msgs, st);
    if (S.aborted) reply.content += reply.content ? '\n\n*(Abgebrochen)*' : '*(Abgebrochen)*';
  } catch (e) {
    if (e.name === 'AbortError') reply.content += reply.content ? '\n\n*(Abgebrochen)*' : '*(Abgebrochen)*';
    else {
      reply.error = true;
      reply.content = st.backend === 'ollama'
        ? 'Keine Verbindung zum lokalen Modell.\n\n**Details:** ' + e.message + '\n\n1. Läuft Ollama? `ollama serve`\n2. Erlaubt Ollama diese Seite? `OLLAMA_ORIGINS="*" ollama serve`\n3. Stimmt der Endpoint in den Einstellungen (aktuell `' + st.endpoint + '`)?\n4. Existiert das Modell? `ollama list`'
        : 'Das Modell konnte nicht im Browser gestartet werden.\n\n**Details:** ' + e.message + '\n\n1. Nutze aktuelles Chrome oder Edge (WebGPU nötig).\n2. Öffne die Seite über `http://localhost` oder Vercel, nicht per Doppelklick auf die Datei.\n3. Beim ersten Start wird das Modell einmalig geladen (Internet nötig, 0,7–2 GB, danach im Browser-Cache).\n4. Genug freier Speicher? Sonst in den Einstellungen auf „Ollama“ wechseln.';
    }
  }
  S.busy = false; S.ctrl = null; S.aborted = false; save(); renderMessages(); updateSend();
}

function regen() {
  const c = chat(); if (!c || S.busy) return;
  while (c.messages.length && c.messages.at(-1).role === 'assistant') c.messages.pop();
  const last = c.messages.pop(); if (last) send(last.content);
}
/* ---------- Rendering ---------- */
function render() {
  if (!S.user) return renderAuth();
  const u = S.user, mdl = MODELS[S.data.model];
  $('#app').innerHTML = `
  <aside id="side" class="glass fixed md:static inset-y-0 left-0 z-40 w-72 max-w-[85vw] flex flex-col p-3 gap-2 transition-transform ${S.sidebar ? '' : '-translate-x-full md:translate-x-0'}">
    <div class="flex items-center gap-2 px-2 py-2">
      <span class="font-semibold text-lg">Blue AI</span>
    </div>
    <button id="new" class="ghost rounded-lg px-3 py-2.5 flex items-center gap-2 text-sm"><i data-lucide="square-pen" class="w-4 h-4"></i>Neuer Chat</button>
    <div class="text-xs text-[color:var(--mute)] px-2 pt-2">Verlauf</div>
    <div id="hist" class="flex-1 overflow-y-auto space-y-1"></div>
    <button id="acc" class="ghost rounded-xl p-2 flex items-center gap-3 text-left">
      <div class="w-8 h-8 rounded-full bg-[#3d7bff] text-white grid place-items-center text-sm font-semibold">${esc(u.name[0].toUpperCase())}</div>
      <div class="min-w-0"><div class="truncate text-sm font-semibold">${esc(u.name)}</div><div class="truncate text-xs text-[color:var(--mute)]">${esc(u.email)}</div></div>
    </button>
  </aside>
  <div id="scrim" class="fixed inset-0 bg-black/50 z-30 ${S.sidebar?'':'hidden'} md:hidden"></div>
  <main class="flex-1 min-w-0 flex flex-col">
    <header class="flex items-center gap-2 p-2 md:px-4">
      <button id="menu" class="md:hidden ghost p-2 rounded-lg" aria-label="Menü"><i data-lucide="menu" class="w-5 h-5"></i></button>
      <div class="relative">
        <button id="modelBtn" class="ghost rounded-lg px-3 py-2 flex items-center gap-2 text-lg font-medium">${esc(mdl.name)}<i data-lucide="chevron-down" class="w-4 h-4"></i></button>
        <div id="modelMenu" class="hidden absolute top-full mt-2 left-0 glow border border-[color:var(--line)] bg-[#2f2f2f] rounded-xl p-1 w-72 z-30">
          ${Object.entries(MODELS).map(([k, m]) => `<button data-model="${k}" class="ghost w-full text-left rounded-lg p-3 ${k===S.data.model?'bg-white/10':''}"><div class="font-semibold text-sm">${m.name}</div><div class="text-xs text-[color:var(--mute)]">${m.desc} · <span class="mono">${S.data.settings.backend === 'ollama' ? esc(S.data.settings.tags[k]) : 'direkt im Browser'}</span></div></button>`).join('')}
        </div>
      </div>
      <div class="flex-1"></div>
      <button id="cfg" class="ghost p-2 rounded-lg" aria-label="Modell-Einstellungen"><i data-lucide="sliders-horizontal" class="w-5 h-5"></i></button>
    </header>
    <section id="body" class="flex-1 overflow-y-auto"></section>
    <footer id="foot" class="px-3 pb-4 pt-1"></footer>
  </main>`;
  renderHistory(); renderBody(); bindShell(); icons();
}

function renderHistory() {
  $('#hist').innerHTML = S.data.chats.length ? S.data.chats.map(c => `
    <div class="group flex items-center rounded-lg ${c.id===S.data.active&&S.view==='chat'?'bg-white/10':''} ghost">
      <button data-chat="${c.id}" class="flex-1 min-w-0 text-left text-sm px-3 py-2 truncate">${esc(c.title)}</button>
      <button data-del="${c.id}" class="p-2 opacity-60 hover:opacity-100" aria-label="Chat löschen"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>`).join('') : '<div class="text-xs text-[color:var(--mute)] px-2">Noch keine Chats. Stelle unten deine erste Frage.</div>';
  icons();
}

function renderBody() {
  const b = $('#body'), f = $('#foot');
  f.innerHTML = `<div class="max-w-3xl mx-auto glass rounded-[26px] pl-4 pr-2 py-1.5 flex items-end gap-2">
    <textarea id="inp" rows="1" placeholder="Frag Blue AI etwas" class="bare resize-none max-h-48"></textarea>
    <button id="sendBtn" class="btn rounded-full p-2 shrink-0 mb-1" aria-label="Senden"></button></div>
    <p class="text-center text-xs text-[color:var(--mute)] mt-2 px-2">${S.data.settings.backend === 'ollama' ? 'Läuft lokal über ' + esc(S.data.settings.endpoint) : 'Läuft komplett in deinem Browser'}. Prüfe wichtige Antworten selbst.</p>`;
  b.innerHTML = '<div id="msgs" class="max-w-3xl mx-auto px-4 py-6 space-y-7"></div>';
  const inp = $('#inp');
  inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 'px'; });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } });
  $('#sendBtn').onclick = () => S.busy ? S.ctrl?.abort() : go();
  function go() { const v = inp.value; inp.value = ''; inp.style.height = 'auto'; send(v); updateSend(); }
  renderMessages(); updateSend();
}
function updateSend() { const b = $('#sendBtn'); if (b) { b.innerHTML = `<i data-lucide="${S.busy ? 'square' : 'arrow-up'}" class="w-5 h-5"></i>`; b.setAttribute('aria-label', S.busy ? 'Stopp' : 'Senden'); icons(); } }

function md(t) {
  const html = DOMPurify.sanitize(marked.parse(t, { breaks: true, gfm: true }));
  const d = document.createElement('div'); d.innerHTML = html;
  d.querySelectorAll('pre').forEach(p => { const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'Kopieren'; b.dataset.copy = '1'; p.appendChild(b); });
  return d.innerHTML;
}
function renderMessages(keepScroll) {
  const box = $('#msgs'); if (!box) return; const c = chat(), body = $('#body');
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 120;
  if (!c || !c.messages.length) {
    box.innerHTML = `<div class="text-center pt-[22vh]"><h1 class="text-3xl font-medium">Wie kann ich dir helfen, ${esc(S.user.name.split(' ')[0])}?</h1></div>`; icons(); return;
  }
  box.innerHTML = c.messages.map((m, i) => m.role === 'user'
    ? `<div class="flex justify-end"><div class="bg-[#2f2f2f] rounded-3xl px-5 py-2.5 max-w-[80%] whitespace-pre-wrap leading-relaxed">${esc(m.content)}</div></div>`
    : `<div><div class="md ${m.error ? 'text-red-300' : ''}">${m.content ? md(m.content) : '<span class="dot">●</span><span class="dot">●</span><span class="dot">●</span>'}</div>${m.content && !m.error && !(S.busy && i === c.messages.length - 1) ? `<div class="flex gap-1 mt-1 text-[color:var(--mute)]">
        <button data-act="copy" data-i="${i}" class="ghost p-1.5 rounded-lg" aria-label="Kopieren"><i data-lucide="copy" class="w-4 h-4"></i></button>
        ${i === c.messages.length - 1 ? '<button data-act="regen" class="ghost p-1.5 rounded-lg" aria-label="Neu generieren"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>' : ''}</div>` : ''}</div>`).join('');
  icons(); if (atBottom || !keepScroll) body.scrollTop = body.scrollHeight;
}

/* ---------- Bindings ---------- */
function bindShell() {
  $('#new').onclick = () => { S.sidebar = false; newChat(); };
  $('#menu').onclick = () => { S.sidebar = true; render(); };
  $('#scrim').onclick = () => { S.sidebar = false; render(); };
  $('#modelBtn').onclick = e => { e.stopPropagation(); $('#modelMenu').classList.toggle('hidden'); };
  document.querySelectorAll('[data-model]').forEach(x => x.onclick = () => { S.data.model = x.dataset.model; save(); render(); });
  $('#cfg').onclick = openSettings; $('#acc').onclick = openAccount;
  $('#hist').onclick = e => {
    const o = e.target.closest('[data-chat]'), d = e.target.closest('[data-del]');
    if (o) { S.data.active = o.dataset.chat; S.view = 'chat'; S.sidebar = false; save(); render(); }
    if (d) { S.data.chats = S.data.chats.filter(c => c.id !== d.dataset.del); if (S.data.active === d.dataset.del) S.data.active = S.data.chats[0]?.id || null; save(); render(); }
  };
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) { if (a.dataset.act === 'regen') regen(); else navigator.clipboard.writeText(chat().messages[+a.dataset.i].content).then(() => toast('Kopiert.')).catch(() => toast('Kopieren nicht möglich.')); }
  if (!e.target.closest('#modelBtn')) $('#modelMenu')?.classList.add('hidden');
  const c = e.target.closest('[data-copy]');
  if (c) { const t = c.parentElement.querySelector('code').innerText; navigator.clipboard.writeText(t).then(() => { c.textContent = 'Kopiert'; setTimeout(() => c.textContent = 'Kopieren', 1400); }).catch(() => toast('Kopieren nicht möglich.')); }
});

/* ---------- Modale ---------- */
function modal(html, wide) {
  $('#modal-root').innerHTML = `<div class="fixed inset-0 z-50 bg-black/65 grid place-items-center p-4" id="mbg"><div class="glow rounded-2xl p-6 w-full border border-[color:var(--line)] bg-[#2f2f2f] ${wide ? 'max-w-xl' : 'max-w-md'} max-h-[92vh] overflow-y-auto" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#mbg').onclick = e => { if (e.target.id === 'mbg' && S.user) closeModal(); };
  icons();
}
const closeModal = () => $('#modal-root').innerHTML = '';

function renderAuth() {
  $('#app').innerHTML = ''; let mode = 'login';
  const draw = () => {
    modal(`<div class="text-center mb-6"><h2 class="text-2xl font-semibold">${mode === 'login' ? 'Bei Blue AI anmelden' : 'Blue AI-Konto erstellen'}</h2></div>
      <div class="space-y-3">
        ${mode === 'register' ? '<input id="a-name" placeholder="Name" autocomplete="name">' : ''}
        <input id="a-mail" type="email" placeholder="E-Mail" autocomplete="email">
        <input id="a-pw" type="password" placeholder="Passwort" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}">
        <div id="a-err" class="text-sm text-red-300 min-h-[1.25rem]" role="alert"></div>
        <button id="a-go" class="btn w-full rounded-xl py-3 font-semibold">${mode === 'login' ? 'Anmelden' : 'Konto erstellen'}</button>
        <button id="a-sw" class="w-full text-sm text-[color:var(--mute)] hover:text-white">${mode === 'login' ? 'Noch kein Konto? Registrieren' : 'Schon registriert? Anmelden'}</button>
      </div>
      <p class="text-xs text-[color:var(--mute)] mt-4 leading-relaxed">Konten und Chats liegen nur in diesem Browser (Passwort mit PBKDF2 gehasht). Das ist ein lokaler Zugang und ersetzt kein Server-Login für mehrere Geräte.</p>`);
    $('#a-sw').onclick = () => { mode = mode === 'login' ? 'register' : 'login'; draw(); };
    const go = async () => {
      const btn = $('#a-go'); btn.disabled = true;
      try {
        if (mode === 'register') await Auth.register($('#a-name').value, $('#a-mail').value, $('#a-pw').value);
        else await Auth.login($('#a-mail').value, $('#a-pw').value);
        boot();
      } catch (e) { $('#a-err').textContent = e.message; btn.disabled = false; }
    };
    $('#a-go').onclick = go; $('#a-pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  };
  draw();
}

function openSettings() {
  const st = S.data.settings;
  modal(`<div class="flex items-center justify-between mb-4"><h2 class="text-lg font-bold">Modell-Einstellungen</h2><button id="x" class="ghost p-2 rounded-lg" aria-label="Schließen"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <div class="space-y-4 text-sm">
      <label class="block">Modell-Ausführung<select id="s-be" class="mt-1"><option value="browser" ${st.backend!=='ollama'?'selected':''}>Direkt im Browser (kein Setup)</option><option value="ollama" ${st.backend==='ollama'?'selected':''}>Ollama (eigener Rechner/Server)</option></select></label>
      <label class="block">Ollama-Endpoint<input id="s-ep" value="${esc(st.endpoint)}" class="mt-1 mono"></label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block">Tag Blue AI 1.0<input id="s-t1" value="${esc(st.tags['blue-1.0'])}" class="mt-1 mono"></label>
        <label class="block">Tag Blue AI 1.1 Pro<input id="s-t2" value="${esc(st.tags['blue-1.1pro'])}" class="mt-1 mono"></label>
      </div>
      <label class="block">Temperatur: <b id="v-t">${st.temperature}</b><input id="s-temp" type="range" min="0" max="2" step="0.05" value="${st.temperature}" class="!p-0 mt-1"></label>
      <label class="block">Top-P: <b id="v-p">${st.top_p}</b><input id="s-top" type="range" min="0" max="1" step="0.05" value="${st.top_p}" class="!p-0 mt-1"></label>
      <label class="block">Kontextlänge (Tokens)<select id="s-ctx" class="mt-1">${[2048, 4096, 8192, 16384].map(n => `<option ${n === +st.num_ctx ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="block">System-Prompt<textarea id="s-sys" rows="4" class="mt-1">${esc(st.system)}</textarea></label>
      <div class="flex gap-2"><button id="s-reset" class="ghost rounded-xl px-4 py-2.5 border border-[color:var(--line)]">Zurücksetzen</button><button id="s-save" class="btn flex-1 rounded-xl py-2.5 font-semibold">Speichern</button></div>
    </div>`, true);
  $('#x').onclick = closeModal;
  $('#s-temp').oninput = e => $('#v-t').textContent = e.target.value;
  $('#s-top').oninput = e => $('#v-p').textContent = e.target.value;
  $('#s-reset').onclick = () => { S.data.settings = structuredClone(DEFAULTS); save(); closeModal(); render(); toast('Standardwerte wiederhergestellt.'); };
  $('#s-save').onclick = () => {
    S.data.settings = { backend: $('#s-be').value, customSystem: $('#s-sys').value !== DEFAULT_SYSTEM, endpoint: $('#s-ep').value.trim() || DEFAULTS.endpoint, temperature: +$('#s-temp').value, top_p: +$('#s-top').value, num_ctx: +$('#s-ctx').value,
      system: $('#s-sys').value, tags: { 'blue-1.0': $('#s-t1').value.trim() || DEFAULTS.tags['blue-1.0'], 'blue-1.1pro': $('#s-t2').value.trim() || DEFAULTS.tags['blue-1.1pro'] } };
    save(); closeModal(); render(); toast('Einstellungen gespeichert.');
  };
}

function openAccount() {
  const u = S.user;
  modal(`<div class="flex items-center justify-between mb-4"><h2 class="text-lg font-bold">Konto</h2><button id="x" class="ghost p-2 rounded-lg" aria-label="Schließen"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <div class="space-y-3 text-sm">
      <label class="block">Name<input id="ac-name" value="${esc(u.name)}" class="mt-1"></label>
      <div class="text-[color:var(--mute)]">${esc(u.email)} · seit ${new Date(u.created).toLocaleDateString('de-DE')}</div>
      <button id="ac-save" class="btn w-full rounded-xl py-2.5 font-semibold">Name speichern</button>
      <button id="ac-exp" class="ghost w-full rounded-xl py-2.5 border border-[color:var(--line)]">Chats exportieren (JSON)</button>
      <button id="ac-out" class="ghost w-full rounded-xl py-2.5 border border-[color:var(--line)]">Abmelden</button>
      <button id="ac-del" class="w-full rounded-xl py-2.5 border border-red-400/40 text-red-300 hover:bg-red-500/10">Konto und alle Chats löschen</button>
    </div>`);
  $('#x').onclick = closeModal;
  $('#ac-save').onclick = () => { const n = $('#ac-name').value.trim(); if (!n) return toast('Name darf nicht leer sein.'); Auth.update({ name: n }); S.user = Auth.current(); closeModal(); render(); toast('Name gespeichert.'); };
  $('#ac-exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S.data.chats, null, 2)], { type: 'application/json' })); a.download = 'blue-ai-chats.json'; a.click(); URL.revokeObjectURL(a.href); };
  $('#ac-out').onclick = () => { Auth.logout(); location.reload(); };
  $('#ac-del').onclick = () => { if (confirm('Konto und alle Chats unwiderruflich löschen?')) { Auth.remove(); location.reload(); } };
}

/* ---------- Start ---------- */
function boot() {
  closeModal(); S.user = Auth.current();
  if (S.user) { loadData(); if (!chat()) S.data.active = S.data.chats[0]?.id || null; render(); } else renderAuth();
}
marked.setOptions({ mangle: false, headerIds: false });
boot();
</script>
</body>
</html>
