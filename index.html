<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue AI Workspace</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bluegrad: {
              start: '#0a1128',
              mid: '#001f54',
              end: '#034078'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Blue Gradient Background */
    body {
      background: linear-gradient(135deg, #030712 0%, #0a192f 40%, #001f54 100%);
      background-attachment: fixed;
    }
    
    /* Blue Gradient UI Elements */
    .btn-blue-gradient {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #0284c7 100%);
      transition: all 0.3s ease;
    }
    .btn-blue-gradient:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #0369a1 100%);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }

    .card-blue-gradient {
      background: linear-gradient(180deg, rgba(30, 58, 138, 0.25) 0%, rgba(15, 23, 42, 0.6) 100%);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.6); }
  </style>
</head>
<body class="text-slate-100 font-sans h-screen flex overflow-hidden antialiased">

  <!-- SIDEBAR (ChatGPT Style) -->
  <aside id="sidebar" class="w-64 bg-slate-950/80 backdrop-blur-xl border-r border-blue-900/30 flex flex-col justify-between hidden md:flex shrink-0 transition-all z-20">
    <div class="p-3 space-y-3">
      <!-- Neuer Chat Button -->
      <button onclick="resetChat()" class="w-full btn-blue-gradient text-white rounded-xl p-3 flex items-center justify-between font-medium shadow-lg cursor-pointer">
        <span class="flex items-center gap-2 text-sm">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> Neuer Chat
        </span>
        <i data-lucide="square-pen" class="w-4 h-4 opacity-70"></i>
      </button>

      <!-- Chat Verlauf (Demo) -->
      <div class="space-y-1 pt-2">
        <div class="text-[11px] font-semibold text-blue-400/70 px-2 uppercase tracking-wider">Verlauf</div>
        <button class="w-full text-left px-3 py-2 rounded-lg text-xs text-slate-300 hover:bg-blue-900/30 truncate flex items-center gap-2 transition">
          <i data-lucide="message-square" class="w-3.5 h-3.5 text-blue-400"></i> Apex Automotive Konfig...
        </button>
        <button class="w-full text-left px-3 py-2 rounded-lg text-xs text-slate-300 hover:bg-blue-900/30 truncate flex items-center gap-2 transition">
          <i data-lucide="message-square" class="w-3.5 h-3.5 text-blue-400"></i> E-Commerce AdSpend Test
        </button>
      </div>
    </div>

    <!-- User Profile & Settings Footer -->
    <div class="p-3 border-t border-blue-900/30 bg-slate-950/40">
      <div class="flex items-center gap-3 px-2 py-1.5 rounded-lg hover:bg-blue-900/20 cursor-pointer transition">
        <div class="w-8 h-8 rounded-full btn-blue-gradient flex items-center justify-center font-bold text-xs shadow">
          AA
        </div>
        <div class="flex-1 truncate">
          <div class="text-xs font-semibold text-slate-200">Apex Developer</div>
          <div class="text-[10px] text-blue-400">Pro License Active</div>
        </div>
        <i data-lucide="settings" class="w-4 h-4 text-slate-400"></i>
      </div>
    </div>
  </aside>

  <!-- MAIN CHAT CONTAINER -->
  <div class="flex-1 flex flex-col h-full relative">

    <!-- HEADER / TOPBAR -->
    <header class="h-14 border-b border-blue-900/30 bg-slate-950/40 backdrop-blur-md px-4 flex items-center justify-between z-10">
      <div class="flex items-center gap-3">
        <!-- Mobile Sidebar Toggle -->
        <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-300 hover:text-white">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Modell Auswahl Dropdown -->
        <div class="relative">
          <select id="model-select" class="appearance-none bg-blue-950/60 border border-blue-500/30 text-blue-200 text-xs font-semibold py-1.5 pl-3 pr-8 rounded-lg focus:outline-none focus:border-blue-400 cursor-pointer backdrop-blur-md">
            <option value="blue-1.1">🚀 Blue AI 1.1 Pro (Multimodal & Full Skills)</option>
            <option value="blue-1.0">⚡ Blue AI 1.0 (Fast Chat & Code)</option>
          </select>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-blue-400 absolute right-2.5 top-2.5 pointer-events-none"></i>
        </div>
      </div>

      <!-- Live Status Badge -->
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-mono bg-blue-500/10 border border-blue-400/30 text-blue-300">
          <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span> Standalone Active
        </span>
      </div>
    </header>

    <!-- CHAT MESSAGES AREA -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-3xl mx-auto w-full">
      
      <!-- HERO WELCOME DASHBOARD (Versteckt sich nach 1. Nachricht) -->
      <div id="welcome-card" class="card-blue-gradient rounded-2xl p-6 md:p-8 text-center my-6 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="w-14 h-14 btn-blue-gradient rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
          <i data-lucide="cpu" class="w-7 h-7 text-white"></i>
        </div>
        <h2 class="text-2xl font-bold tracking-tight mb-2 text-white">Was möchtest du heute bauen?</h2>
        <p class="text-xs md:text-sm text-slate-300 max-w-md mx-auto mb-6">
          Wähle ein Modell und nutze die integrierten Skills von <strong>Blue AI 1.1 Pro</strong> für Web-Entwicklung, Business-Analysen & Dropshipping.
        </p>

        <!-- SKILLS PRESETS / SUGGESTIONS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-left">
          <button onclick="sendPreset('Schreibe mir ein TailWind CSS / HTML Web-Interface')" class="p-3 bg-slate-900/60 hover:bg-blue-900/40 border border-blue-800/40 rounded-xl transition group cursor-pointer">
            <div class="flex items-center gap-2 text-blue-400 text-xs font-semibold mb-1">
              <i data-lucide="code-2" class="w-4 h-4"></i> Fullstack Web Dev Skill
            </div>
            <div class="text-xs text-slate-300">Code ein responsive HTML/Tailwind Interface...</div>
          </button>

          <button onclick="sendPreset('Erstelle eine E-Commerce Dropshipping Ads Strategie')" class="p-3 bg-slate-900/60 hover:bg-blue-900/40 border border-blue-800/40 rounded-xl transition group cursor-pointer">
            <div class="flex items-center gap-2 text-cyan-400 text-xs font-semibold mb-1">
              <i data-lucide="trending-up" class="w-4 h-4"></i> E-Com & AdSpend Skill
            </div>
            <div class="text-xs text-slate-300">Berechne AdSpend & Margen für TikTok Ads...</div>
          </button>
        </div>
      </div>

    </main>

    <!-- INPUT BAR (ChatGPT Style mit Gradient Buttons) -->
    <footer class="p-4 bg-slate-950/60 backdrop-blur-md">
      <div class="max-w-3xl mx-auto">
        <form id="chat-form" class="relative flex items-center bg-slate-900/90 border border-blue-800/50 rounded-2xl p-2 shadow-2xl focus-within:border-blue-500 transition">
          <textarea 
            id="user-input" 
            rows="1" 
            placeholder="Frag Blue AI etwas..." 
            class="w-full bg-transparent px-3 py-2 text-sm text-slate-100 placeholder-slate-400 focus:outline-none resize-none"
          ></textarea>
          
          <button 
            type="submit" 
            class="btn-blue-gradient p-2.5 text-white rounded-xl transition-all shadow-md flex items-center justify-center cursor-pointer shrink-0 ml-2"
          >
            <i data-lucide="arrow-up" class="w-4 h-4 stroke-[3]"></i>
          </button>
        </form>

        <div class="flex items-center justify-between text-[11px] text-slate-400 mt-2 px-2">
          <span id="active-model-indicator" class="font-mono">Modell: Blue AI 1.1 Pro</span>
          <span>Apex OS • Vercel Ready</span>
        </div>
      </div>
    </footer>

  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const modelSelect = document.getElementById('model-select');
    const activeModelIndicator = document.getElementById('active-model-indicator');
    const welcomeCard = document.getElementById('welcome-card');

    // Auto-resize Textarea
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
    });

    // Enter Key Handler
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    // Model Change Listener
    modelSelect.addEventListener('change', (e) => {
      activeModelIndicator.innerText = `Modell: ${e.target.options[e.target.selectedIndex].text.split('(')[0]}`;
    });

    // Preset Click Handler
    function sendPreset(text) {
      userInput.value = text;
      chatForm.dispatchEvent(new Event('submit'));
    }

    // Chat Processing
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      if (welcomeCard) welcomeCard.remove();

      const selectedModel = modelSelect.value;
      const modelDisplayName = modelSelect.options[modelSelect.selectedIndex].text.split('(')[0];

      // Add User Message
      appendMessage('user', message);
      userInput.value = '';
      userInput.style.height = 'auto';
      scrollToBottom();

      // Show Loading State
      const loadingId = appendLoading(modelDisplayName);
      scrollToBottom();

      // Simulated Response Generator
      setTimeout(() => {
        removeLoading(loadingId);

        let aiResponse = "";
        if (selectedModel === 'blue-1.1') {
          aiResponse = `[Blue AI 1.1 Pro Skills Active]:\n\nIch habe deine Anfrage ("${message}") mit aktivierter Logik-Engine verarbeitet.\n\n- Skill-Check: Erfolgreich ausgeführt\n- Antwort-Status: Bereit für die Integration in dein Apex Automotive- oder E-Commerce-Projekt!`;
        } else {
          aiResponse = `[Blue AI 1.0]: Schnelle Antwort generiert für: "${message}". System läuft optimal.`;
        }

        appendMessage('assistant', aiResponse, selectedModel);
        scrollToBottom();
      }, 900);
    });

    function appendMessage(role, text, model = '') {
      const isUser = role === 'user';
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex gap-3 ${isUser ? 'justify-end' : 'justify-start'}`;

      const avatar = isUser ? 
        `<div class="w-8 h-8 rounded-xl btn-blue-gradient flex items-center justify-center text-xs font-bold shrink-0 shadow">DU</div>` :
        `<div class="w-8 h-8 rounded-xl bg-blue-950 border border-blue-500/40 text-blue-400 flex items-center justify-center shrink-0 shadow"><i data-lucide="cpu" class="w-4 h-4"></i></div>`;

      msgDiv.innerHTML = `
        ${!isUser ? avatar : ''}
        <div class="max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-lg ${
          isUser 
            ? 'btn-blue-gradient text-white rounded-br-xs' 
            : 'bg-slate-900/90 border border-blue-900/40 text-slate-200 rounded-bl-xs backdrop-blur-md'
        }">
          ${!isUser ? `<div class="text-[10px] font-mono text-blue-400 mb-1 font-semibold flex items-center gap-1"><i data-lucide="sparkles" class="w-3 h-3"></i> ${model === 'blue-1.1' ? 'Blue AI 1.1 Pro' : 'Blue AI 1.0'}</div>` : ''}
          <p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(text)}</p>
        </div>
        ${isUser ? avatar : ''}
      `;

      chatContainer.appendChild(msgDiv);
      lucide.createIcons();
    }

    function appendLoading(modelName) {
      const id = 'loading-' + Date.now();
      const loadDiv = document.createElement('div');
      loadDiv.id = id;
      loadDiv.className = 'flex gap-3 justify-start';
      loadDiv.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-blue-950 border border-blue-500/40 text-blue-400 flex items-center justify-center shrink-0">
          <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        </div>
        <div class="bg-slate-900/90 border border-blue-900/40 rounded-2xl rounded-bl-xs px-4 py-3 text-xs text-blue-300 flex items-center gap-2">
          <span>${modelName} verarbeitet...</span>
        </div>
      `;
      chatContainer.appendChild(loadDiv);
      lucide.createIcons();
      return id;
    }

    function removeLoading(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function resetChat() {
      location.reload();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
