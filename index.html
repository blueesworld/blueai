<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue AI Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#0b1329',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #030712 0%, #061127 40%, #001f54 100%);
      background-attachment: fixed;
    }
    .btn-blue-gradient {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #0284c7 100%);
      transition: all 0.25s ease;
    }
    .btn-blue-gradient:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #0369a1 100%);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }
    .glass-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.75) 0%, rgba(10, 25, 47, 0.85) 100%);
      border: 1px solid rgba(59, 130, 246, 0.25);
      backdrop-filter: blur(16px);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.6); }
    pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body class="text-slate-100 font-sans h-screen flex overflow-hidden antialiased">

  <!-- AUTH MODAL (Login / Register) -->
  <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4 transition-all duration-300 hidden">
    <div class="glass-card w-full max-w-md rounded-2xl p-6 md:p-8 shadow-2xl relative border border-blue-500/30">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- TAB SWITCHER -->
      <div class="flex border-b border-blue-900/50 mb-6">
        <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-sm font-semibold border-b-2 border-blue-500 text-blue-400 transition">Anmelden</button>
        <button id="tab-register-btn" onclick="switchAuthTab('register')" class="flex-1 py-2.5 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Registrieren</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleAuth(event, 'login')" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-blue-300 mb-1">E-Mail Adresse</label>
          <input type="email" required placeholder="name@beispiel.de" class="w-full bg-slate-900/90 border border-blue-800/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-blue-300 mb-1">Passwort</label>
          <input type="password" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-blue-800/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full btn-blue-gradient text-white rounded-xl py-3 font-semibold text-sm shadow-lg mt-2">Einloggen</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" onsubmit="handleAuth(event, 'register')" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-blue-300 mb-1">Vollständiger Name</label>
          <input type="text" id="reg-name" required placeholder="Max Mustermann" class="w-full bg-slate-900/90 border border-blue-800/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-blue-300 mb-1">E-Mail Adresse</label>
          <input type="email" required placeholder="name@beispiel.de" class="w-full bg-slate-900/90 border border-blue-800/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-blue-300 mb-1">Passwort erstellen</label>
          <input type="password" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-blue-800/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full btn-blue-gradient text-white rounded-xl py-3 font-semibold text-sm shadow-lg mt-2">Konto Erstellen</button>
      </form>
    </div>
  </div>

  <!-- SIDEBAR (Clean & Dynamic) -->
  <aside id="sidebar" class="w-64 bg-slate-950/80 backdrop-blur-xl border-r border-blue-900/30 flex flex-col justify-between hidden md:flex shrink-0 transition-all z-20">
    <div class="p-3 space-y-3">
      <!-- NEW CHAT BUTTON -->
      <button onclick="resetWorkspace()" class="w-full btn-blue-gradient text-white rounded-xl p-3 flex items-center justify-between font-medium shadow-lg cursor-pointer">
        <span class="flex items-center gap-2 text-sm">
          <i data-lucide="plus" class="w-4 h-4"></i> Neuer Chat
        </span>
        <i data-lucide="square-pen" class="w-4 h-4 opacity-70"></i>
      </button>

      <!-- ACTIVE SESSION ITEM -->
      <div class="pt-2">
        <div class="text-[10px] font-semibold text-blue-400/80 px-2 uppercase tracking-wider mb-2">Aktuelle Sitzung</div>
        <div class="w-full text-left px-3 py-2 rounded-lg text-xs bg-blue-900/30 border border-blue-500/20 text-slate-200 truncate flex items-center gap-2">
          <i data-lucide="message-square" class="w-3.5 h-3.5 text-blue-400 shrink-0"></i>
          <span id="sidebar-session-title">Neues Gespräch</span>
        </div>
      </div>
    </div>

    <!-- USER / AUTH FOOTER -->
    <div class="p-3 border-t border-blue-900/30 bg-slate-950/40">
      <div id="user-profile-btn" onclick="openAuthModal()" class="flex items-center gap-3 px-2 py-2 rounded-xl hover:bg-blue-900/20 cursor-pointer transition">
        <div id="user-avatar" class="w-9 h-9 rounded-xl btn-blue-gradient flex items-center justify-center font-bold text-xs shadow">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 truncate">
          <div id="user-name-display" class="text-xs font-semibold text-slate-200">Gastzugang</div>
          <div id="user-status-display" class="text-[10px] text-blue-400">Klick zum Anmelden</div>
        </div>
        <i data-lucide="log-in" class="w-4 h-4 text-slate-400"></i>
      </div>
    </div>
  </aside>

  <!-- MAIN VIEWPORT -->
  <div class="flex-1 flex flex-col h-full relative">

    <!-- TOPBAR / MODEL SELECTOR -->
    <header class="h-14 border-b border-blue-900/30 bg-slate-950/40 backdrop-blur-md px-4 flex items-center justify-between z-10">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-300 hover:text-white">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- HIGH-PERFORMANCE MODEL SELECTOR -->
        <div class="relative">
          <select id="model-select" onchange="updateModelDescription()" class="appearance-none bg-blue-950/70 border border-blue-500/40 text-blue-200 text-xs font-semibold py-1.5 pl-3 pr-8 rounded-lg focus:outline-none focus:border-blue-400 cursor-pointer backdrop-blur-md">
            <option value="blue-1.1">🚀 Blue AI 1.1 Pro (Multimodal & Advanced Intelligence)</option>
            <option value="blue-1.0">⚡ Blue AI 1.0 (High-Speed Code & Logic)</option>
          </select>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-blue-400 absolute right-2.5 top-2.5 pointer-events-none"></i>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-mono bg-blue-500/10 border border-blue-400/30 text-blue-300">
          <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
          <span id="engine-status">Engine Ready</span>
        </span>
      </div>
    </header>

    <!-- CHAT MESSAGES DISPLAY -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-3xl mx-auto w-full">
      
      <!-- HERO LANDING CARD -->
      <div id="welcome-card" class="glass-card rounded-2xl p-6 md:p-8 text-center my-8 shadow-2xl relative overflow-hidden">
        <div class="w-14 h-14 btn-blue-gradient rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
          <i data-lucide="sparkles" class="w-7 h-7 text-white"></i>
        </div>
        <h2 class="text-2xl font-bold tracking-tight mb-2 text-white">Wobei kann ich dir heute helfen?</h2>
        <p class="text-xs md:text-sm text-slate-300 max-w-md mx-auto mb-6">
          Systeme für Code-Generierung, E-Commerce-Analysen und Automatisierung über <strong>Blue AI 1.1 Pro</strong>.
        </p>

        <!-- PRESET PROMPTS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-left">
          <button onclick="sendPreset('Erstelle ein hochmodernes HTML/Tailwind CSS Interface für ein Autohaus')" class="p-3.5 bg-slate-900/80 hover:bg-blue-950/60 border border-blue-800/40 rounded-xl transition group cursor-pointer">
            <div class="flex items-center gap-2 text-blue-400 text-xs font-semibold mb-1">
              <i data-lucide="code-2" class="w-4 h-4"></i> High-End Code Gen
            </div>
            <div class="text-xs text-slate-300">Generiere komplexe Single-Page Web-Apps...</div>
          </button>

          <button onclick="sendPreset('Analysiere Werbebudget & Margen für eine E-Commerce Dropshipping Brand')" class="p-3.5 bg-slate-900/80 hover:bg-blue-950/60 border border-blue-800/40 rounded-xl transition group cursor-pointer">
            <div class="flex items-center gap-2 text-cyan-400 text-xs font-semibold mb-1">
              <i data-lucide="calculator" class="w-4 h-4"></i> Business & Finance Logic
            </div>
            <div class="text-xs text-slate-300">Kalkuliere AdSpend, Steuern und Deckungsbeitrag...</div>
          </button>
        </div>
      </div>

    </main>

    <!-- INPUT BAR AREA -->
    <footer class="p-4 bg-slate-950/60 backdrop-blur-md">
      <div class="max-w-3xl mx-auto">
        <form id="chat-form" class="relative flex items-center bg-slate-900/90 border border-blue-800/50 rounded-2xl p-2 shadow-2xl focus-within:border-blue-500 transition">
          <textarea 
            id="user-input" 
            rows="1" 
            placeholder="Nachricht an Blue AI senden..." 
            class="w-full bg-transparent px-3 py-2 text-sm text-slate-100 placeholder-slate-400 focus:outline-none resize-none"
          ></textarea>
          
          <button 
            type="submit" 
            class="btn-blue-gradient p-2.5 text-white rounded-xl transition-all shadow-md flex items-center justify-center cursor-pointer shrink-0 ml-2"
          >
            <i data-lucide="arrow-up" class="w-4 h-4 stroke-[3]"></i>
          </button>
        </form>

        <div class="flex items-center justify-between text-[11px] text-slate-400 mt-2 px-2">
          <span id="active-model-indicator" class="font-mono text-blue-400">Modell: Blue AI 1.1 Pro</span>
          <span>Apex OS Engine • Standalone</span>
        </div>
      </div>
    </footer>

  </div>

  <script>
    lucide.createIcons();

    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const modelSelect = document.getElementById('model-select');
    const activeModelIndicator = document.getElementById('active-model-indicator');
    const welcomeCard = document.getElementById('welcome-card');
    const sidebarSessionTitle = document.getElementById('sidebar-session-title');

    let isFirstMessage = true;
    let currentUser = null;

    // AUTO RESIZE TEXTAREA
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    function updateModelDescription() {
      const selected = modelSelect.value;
      activeModelIndicator.innerText = selected === 'blue-1.1' ? 'Modell: Blue AI 1.1 Pro' : 'Modell: Blue AI 1.0';
    }

    function sendPreset(text) {
      userInput.value = text;
      chatForm.dispatchEvent(new Event('submit'));
    }

    // MAIN AI RESPONSE GENERATOR (High-Intelligence Simulation Engine)
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      if (isFirstMessage) {
        if (welcomeCard) welcomeCard.remove();
        sidebarSessionTitle.innerText = message.length > 20 ? message.substring(0, 20) + '...' : message;
        isFirstMessage = false;
      }

      const selectedModel = modelSelect.value;
      appendMessage('user', message);
      userInput.value = '';
      userInput.style.height = 'auto';
      scrollToBottom();

      const loadingId = appendLoading();
      scrollToBottom();

      // ADVANCED AI ENGINE PROCESSOR
      setTimeout(() => {
        removeLoading(loadingId);
        const aiResponse = generateAdvancedResponse(message, selectedModel);
        appendMessage('assistant', aiResponse, selectedModel);
        scrollToBottom();
      }, 1100);
    });

    function generateAdvancedResponse(query, model) {
      const q = query.toLowerCase();

      // CODE ENGINE RESPONSE
      if (q.includes('code') || q.includes('html') || q.includes('interface') || q.includes('autohaus') || q.includes('website')) {
        return `### 🚀 Blue AI Code Engine Result\n\nHier ist ein optimiertes Code-Gerüst basierend auf deiner Anfrage:\n\n\`\`\`html\n<div class="bg-slate-900 border border-blue-500/30 rounded-2xl p-6 shadow-xl">\n  <h3 class="text-xl font-bold text-white mb-2">Apex Custom Vehicles</h3>\n  <p class="text-sm text-slate-300 mb-4">Konfiguriere deinen Gebrauchtwagen mit Neuwagen-Feeling.</p>\n  <button class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2.5 rounded-xl transition">\n    Konfigurator Starten →\n  </button>\n</div>\n\`\`\`\n\n- **Modell:** ${model === 'blue-1.1' ? 'Blue AI 1.1 Pro' : 'Blue AI 1.0'}\n- **Optimierung:** Responsive Flexbox/Grid + Glassmorphism.`;
      }

      // BUSINESS / ADSPEND RESPONSE
      if (q.includes('adspend') || q.includes('dropshipping') || q.includes('business') || q.includes('marge') || q.includes('steuer')) {
        return `### 📊 Blue AI Financial & Analytics Engine\n\n**Analyse für E-Commerce Skalierung:**\n\n1. **Empfohlenes AdSpend Test-Budget:** 15 € – 25 € pro Ad-Set / Tag.\n2. **Break-Even ROAS Berechnungs-Formel:**\n   $$\\text{Break-Even ROAS} = \\frac{\\text{Verkaufspreis}}{\\text{Verkaufspreis} - \\text{EK-Preis} - \\text{Versand}}$$\n3. **Steuerhinweis (DE):** Bei Zielumsätzen über 25.000 €/Jahr greift die Regelbesteuerung (19 % USt.). Sauberes Buchhaltungssystem ab Tag 1 erforderlich.`;
      }

      // GENERAL INTELLECTUAL RESPONSE
      if (model === 'blue-1.1') {
        return `[Blue AI 1.1 Pro Engine]\n\nIch habe deine Anfrage ("${query}") analysiert und verarbeitet.\n\nDas System arbeitet mit erweiterter Kontext-Erkennung. Alle Parameter sind optimal ausgerichtet, um deine Anforderung im Apex-Ökosystem direkt umzusetzen. Wie wollen wir im nächsten Schritt fortfahren?`;
      } else {
        return `[Blue AI 1.0 High-Speed Engine]\n\nPräzise Antwort auf deine Eingabe: "${query}".\n\nDas 1.0 Modell ist auf maximale Geschwindigkeit und strukturierte Ausführung ausgelegt.`;
      }
    }

    function appendMessage(role, text, model = '') {
      const isUser = role === 'user';
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex gap-3 ${isUser ? 'justify-end' : 'justify-start'}`;

      const avatar = isUser ? 
        `<div class="w-8 h-8 rounded-xl btn-blue-gradient flex items-center justify-center text-xs font-bold shrink-0 shadow">` + (currentUser ? currentUser.substring(0, 2).toUpperCase() : 'DU') + `</div>` :
        `<div class="w-8 h-8 rounded-xl bg-blue-950 border border-blue-500/40 text-blue-400 flex items-center justify-center shrink-0 shadow"><i data-lucide="sparkles" class="w-4 h-4"></i></div>`;

      // Formatiere Markdown-Syntax grob
      let formattedText = escapeHtml(text)
        .replace(/```html([\s\S]*?)```/g, '<pre class="bg-slate-950 border border-blue-900/50 p-3 rounded-xl my-2 text-xs overflow-x-auto text-blue-300"><code>$1</code></pre>')
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>')
        .replace(/### (.*?)\n/g, '<h4 class="text-base font-bold text-blue-300 mt-2 mb-1">$1</h4>');

      msgDiv.innerHTML = `
        ${!isUser ? avatar : ''}
        <div class="max-w-[85%] rounded-2xl px-4 py-3 text-sm shadow-lg ${
          isUser 
            ? 'btn-blue-gradient text-white rounded-br-xs' 
            : 'glass-card text-slate-200 rounded-bl-xs'
        }">
          ${!isUser ? `<div class="text-[10px] font-mono text-blue-400 mb-1 font-semibold flex items-center gap-1"><i data-lucide="cpu" class="w-3 h-3"></i> ${model === 'blue-1.1' ? 'Blue AI 1.1 Pro' : 'Blue AI 1.0'}</div>` : ''}
          <div class="leading-relaxed text-xs md:text-sm space-y-1">${formattedText}</div>
        </div>
        ${isUser ? avatar : ''}
      `;

      chatContainer.appendChild(msgDiv);
      lucide.createIcons();
    }

    function appendLoading() {
      const id = 'loading-' + Date.now();
      const loadDiv = document.createElement('div');
      loadDiv.id = id;
      loadDiv.className = 'flex gap-3 justify-start';
      loadDiv.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-blue-950 border border-blue-500/40 text-blue-400 flex items-center justify-center shrink-0">
          <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        </div>
        <div class="glass-card rounded-2xl rounded-bl-xs px-4 py-3 text-xs text-blue-300 flex items-center gap-2">
          <span>Blue AI verarbeitet Eingabe...</span>
        </div>
      `;
      chatContainer.appendChild(loadDiv);
      lucide.createIcons();
      return id;
    }

    function removeLoading(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function resetWorkspace() {
      location.reload();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // AUTH MODAL LOGIC
    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
    }
    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }
    function switchAuthTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const loginBtn = document.getElementById('tab-login-btn');
      const regBtn = document.getElementById('tab-register-btn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        loginBtn.className = "flex-1 py-2.5 text-sm font-semibold border-b-2 border-blue-500 text-blue-400 transition";
        regBtn.className = "flex-1 py-2.5 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        regBtn.className = "flex-1 py-2.5 text-sm font-semibold border-b-2 border-blue-500 text-blue-400 transition";
        loginBtn.className = "flex-1 py-2.5 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
      }
    }

    function handleAuth(e, type) {
      e.preventDefault();
      const nameInput = type === 'register' ? document.getElementById('reg-name').value : 'Benutzer';
      currentUser = nameInput;

      document.getElementById('user-name-display').innerText = nameInput;
      document.getElementById('user-status-display').innerText = 'Pro Konto Aktiv';
      document.getElementById('user-avatar').innerText = nameInput.substring(0, 2).toUpperCase();

      closeAuthModal();
    }
  </script>
</body>
</html>
